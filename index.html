<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>課堂聽眾專注度分析</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #1c2430;
      --muted: #687487;
      --line: #dfe5ee;
      --brand: #146c70;
      --brand-strong: #0f5053;
      --accent: #b7791f;
      --danger: #b42318;
      --good: #177245;
      --blue: #315b9f;
      --shadow: 0 16px 38px rgba(30, 40, 55, 0.10);
      --radius: 8px;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(20, 108, 112, 0.08), rgba(246, 247, 249, 0) 260px),
        var(--bg);
      color: var(--ink);
      transition: background 0.25s ease;
    }

    body.dashboard-mode {
      background: #eef2f7;
    }

    body.dashboard-mode.dashboard-low {
      background: #177245;
    }

    body.dashboard-mode.dashboard-medium {
      background: #f2c94c;
    }

    body.dashboard-mode.dashboard-high {
      background: #b42318;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 1px solid transparent;
      border-radius: var(--radius);
      min-height: 42px;
      padding: 0 14px;
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
      white-space: nowrap;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    input,
    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      min-height: 42px;
      padding: 9px 11px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(20, 108, 112, 0.16);
    }

    .shell {
      width: min(1260px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 38px;
    }

    .dashboard-toggle {
      position: fixed;
      right: 18px;
      top: 18px;
      z-index: 50;
      background: #17212f;
      border-color: #17212f;
      color: #fff;
      box-shadow: 0 12px 26px rgba(14, 21, 31, 0.24);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .title h1 {
      margin: 0;
      font-size: clamp(26px, 4vw, 42px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .title p {
      margin: 10px 0 0;
      color: var(--muted);
      max-width: 760px;
      line-height: 1.6;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(340px, 0.65fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .camera-panel {
      overflow: hidden;
    }

    .camera-panel.preview-hidden .video-wrap {
      display: none;
    }

    .video-wrap {
      position: relative;
      min-height: 320px;
      aspect-ratio: 16 / 10;
      background: #111923;
      display: grid;
      place-items: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .camera-panel.has-stream video {
      display: block;
    }

    .empty-camera {
      text-align: center;
      color: #c8d2df;
      padding: 26px;
      line-height: 1.6;
    }

    .camera-panel.has-stream .empty-camera {
      display: none;
    }

    .live-badge {
      position: absolute;
      left: 14px;
      top: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 30px;
      padding: 4px 10px;
      border-radius: 999px;
      color: #fff;
      background: rgba(13, 19, 28, 0.72);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0;
      backdrop-filter: blur(10px);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #8492a6;
    }

    .dot.on {
      background: #24b47e;
      box-shadow: 0 0 0 5px rgba(36, 180, 126, 0.20);
    }

    .camera-actions,
    .settings,
    .results-head {
      display: grid;
      gap: 12px;
      padding: 14px;
      border-top: 1px solid var(--line);
    }

    .camera-actions {
      grid-template-columns: repeat(6, minmax(0, 1fr));
    }

    .primary {
      color: #fff;
      background: var(--brand);
      border-color: var(--brand);
    }

    .primary:hover:not(:disabled) {
      background: var(--brand-strong);
    }

    .secondary {
      color: var(--ink);
      background: #f7f9fc;
      border-color: var(--line);
    }

    .danger {
      color: #fff;
      background: var(--danger);
      border-color: var(--danger);
    }

    .settings {
      grid-template-columns: repeat(12, minmax(0, 1fr));
      align-items: end;
    }

    .provider-field,
    .interval-field {
      grid-column: span 3;
    }

    .endpoint-field,
    .camera-field {
      grid-column: span 5;
    }

    .key-field,
    .model-field {
      grid-column: span 4;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    label {
      color: #3b4655;
      font-size: 13px;
      font-weight: 800;
    }

    .side {
      display: grid;
      gap: 18px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      padding: 14px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
      min-height: 96px;
      display: grid;
      align-content: space-between;
      background: #fbfcfe;
    }

    .metric.full {
      grid-column: 1 / -1;
    }

    .metric .label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .metric .value {
      margin-top: 10px;
      font-size: 30px;
      line-height: 1;
      font-weight: 900;
      color: var(--ink);
      overflow-wrap: anywhere;
    }

    .metric .value.small {
      font-size: 16px;
      line-height: 1.4;
      font-weight: 700;
      color: #354254;
    }

    .phone-panel {
      padding: 14px;
    }

    .phone-stat {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fbfcfe;
      padding: 14px;
      display: grid;
      gap: 8px;
    }

    .phone-value {
      font-size: 38px;
      line-height: 1;
      font-weight: 900;
      color: var(--brand);
    }

    .phone-detail {
      color: var(--muted);
      line-height: 1.45;
      font-weight: 700;
    }

    .status {
      border-top: 1px solid var(--line);
      padding: 12px 14px;
      min-height: 50px;
      color: var(--muted);
      line-height: 1.45;
    }

    .status.ok {
      color: var(--good);
    }

    .status.warn {
      color: var(--accent);
    }

    .status.error {
      color: var(--danger);
    }

    .chart-panel {
      padding: 14px;
    }

    .chart-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .chart-title h2,
    .results-head h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0;
    }

    .chart-title span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .chart {
      width: 100%;
      height: 190px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fbfcfe;
      display: block;
    }

    .results-panel {
      margin-top: 18px;
      overflow: hidden;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    th,
    td {
      padding: 12px 14px;
      border-top: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      line-height: 1.45;
    }

    th {
      color: #3c4654;
      background: #f8fafc;
      font-size: 13px;
      font-weight: 900;
    }

    td {
      color: #2b3645;
      font-size: 14px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 12px;
      font-weight: 900;
      background: #edf3ff;
      color: var(--blue);
      border: 1px solid #cfdcf4;
    }

    .pill.low {
      background: #fff5ea;
      color: #8b4b12;
      border-color: #efcfaa;
    }

    .pill.medium {
      background: #edf3ff;
      color: var(--blue);
      border-color: #cfdcf4;
    }

    .pill.high {
      background: #eaf7f0;
      color: var(--good);
      border-color: #bfe4cd;
    }

    .empty-row {
      text-align: center;
      color: var(--muted);
      padding: 24px 14px;
    }

    .hidden {
      display: none !important;
    }

    body.dashboard-mode .shell {
      width: min(1800px, calc(100vw - 32px));
      min-height: 100vh;
      padding: clamp(14px, 2vw, 30px) 0;
    }

    body.dashboard-mode .topbar,
    body.dashboard-mode .main-workspace {
      display: none;
    }

    body.dashboard-mode .layout {
      display: block;
    }

    body.dashboard-mode .side {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
      gap: clamp(12px, 1.8vw, 24px);
      align-items: stretch;
    }

    body.dashboard-mode .panel {
      box-shadow: 0 18px 42px rgba(15, 22, 32, 0.18);
    }

    body.dashboard-mode .metrics {
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    }

    body.dashboard-mode .chart-panel {
      grid-column: span 2;
    }

    body.dashboard-mode .chart {
      height: clamp(220px, 26vh, 340px);
    }

    body.dashboard-mode .phone-value,
    body.dashboard-mode .metric .value {
      font-size: clamp(34px, 6vw, 72px);
    }

    body.dashboard-mode .metric .value.small {
      font-size: clamp(16px, 1.6vw, 24px);
    }

    canvas.capture {
      display: none;
    }

    @media (max-width: 960px) {
      .topbar,
      .layout {
        grid-template-columns: 1fr;
        display: grid;
      }

      body.dashboard-mode .chart-panel {
        grid-column: auto;
      }
    }

    @media (max-width: 720px) {
      .shell {
        width: min(100vw - 20px, 1260px);
        padding-top: 18px;
      }

      .camera-actions,
      .settings,
      .metrics {
        grid-template-columns: 1fr;
      }

      .provider-field,
      .endpoint-field,
      .key-field,
      .model-field,
      .interval-field,
      .camera-field {
        grid-column: auto;
      }

      .video-wrap {
        min-height: 230px;
        aspect-ratio: 4 / 3;
      }
    }
  </style>
</head>
<body>
  <button class="dashboard-toggle" id="dashboardBtn" type="button" aria-pressed="false">Dashboard 模式</button>
  <main class="shell">
    <header class="topbar">
      <div class="title">
        <h1>課堂聽眾專注度分析</h1>
        <p>以鏡頭畫面定時估算群體專注狀態，只保留數字與文字分析結果，不保存照片。</p>
      </div>
    </header>

    <section class="layout">
      <div class="main-workspace">
        <section class="panel camera-panel" id="cameraPanel">
          <div class="video-wrap">
            <video id="camera" autoplay playsinline muted></video>
            <div class="empty-camera" id="emptyCamera">
              尚未啟動鏡頭。Windows 請用 Chrome 或 Edge，允許瀏覽器使用 USB camera。
            </div>
            <div class="live-badge"><span class="dot" id="liveDot"></span><span id="liveText">待機</span></div>
          </div>

          <div class="camera-actions">
            <button class="secondary" id="cameraBtn" type="button">開啟鏡頭</button>
            <button class="secondary" id="refreshCamerasBtn" type="button">重新掃描鏡頭</button>
            <button class="secondary" id="previewToggleBtn" type="button">隱藏影像</button>
            <button class="primary" id="startBtn" type="button">開始分析</button>
            <button class="secondary" id="pauseBtn" type="button" disabled>暫停</button>
            <button class="secondary" id="captureBtn" type="button">手動拍攝</button>
            <button class="danger" id="clearBtn" type="button">清除紀錄</button>
          </div>

          <div class="settings">
            <div class="field provider-field">
              <label for="apiProvider">API 來源</label>
              <select id="apiProvider">
                <option value="cgu" selected>長庚 CGU LLM</option>
                <option value="openai">OpenAI</option>
                <option value="custom">自定義</option>
              </select>
            </div>
            <div class="field endpoint-field">
              <label for="apiEndpoint">Endpoint</label>
              <input id="apiEndpoint" type="url" autocomplete="off" spellcheck="false" value="https://air.cgu.edu.tw/cgullmapi/v1" placeholder="https://api.openai.com/v1 或完整 /responses endpoint">
            </div>
            <div class="field key-field">
              <label for="apiKey">API key / Authorization</label>
              <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="輸入 API key 或 Bearer ...">
            </div>
            <div class="field model-field">
              <label for="model">模型</label>
              <input id="model" type="text" list="modelSuggestions" autocomplete="off" spellcheck="false" value="gpt-6-luna" placeholder="例如 gpt-6-luna、gpt-5.6-luna">
              <datalist id="modelSuggestions">
                <option value="gpt-6-luna"></option>
                <option value="gpt-5.6-luna"></option>
              </datalist>
            </div>
            <div class="field interval-field">
              <label for="interval">間隔秒數</label>
              <input id="interval" type="number" min="10" step="5" value="30">
            </div>
            <div class="field camera-field">
              <label for="cameraSource">鏡頭來源</label>
              <select id="cameraSource">
                <option value="default" selected>自動選擇 / USB 或內建鏡頭</option>
                <option value="user">前鏡頭</option>
                <option value="environment">後鏡頭 / iPhone 主鏡頭</option>
              </select>
            </div>
          </div>
        </section>

        <section class="panel results-panel">
          <div class="results-head">
            <h2>分析紀錄</h2>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>時間</th>
                  <th>總人數</th>
                  <th>疑似不專心</th>
                  <th>比例</th>
                  <th>摘要</th>
                </tr>
              </thead>
              <tbody id="resultsBody">
                <tr><td class="empty-row" colspan="5">尚無分析結果</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>

      <aside class="side">
        <section class="panel">
          <div class="metrics">
            <div class="metric">
              <div class="label">總人數</div>
              <div class="value" id="totalPeople">0</div>
            </div>
            <div class="metric">
              <div class="label">疑似不專心</div>
              <div class="value" id="inattentivePeople">0</div>
            </div>
            <div class="metric full">
              <div class="label">最近摘要</div>
              <div class="value small" id="summary">尚未分析</div>
            </div>
          </div>
          <div class="status" id="status">請確認 API 來源、Endpoint、API key 與模型後開始。</div>
        </section>

        <section class="panel chart-panel">
          <div class="chart-title">
            <h2>比例趨勢</h2>
            <span id="sampleCount">0 筆</span>
          </div>
          <svg class="chart" id="chart" viewBox="0 0 520 190" role="img" aria-label="不專心比例趨勢圖">
            <line x1="44" y1="18" x2="44" y2="154" stroke="#cfd7e3" stroke-width="1"></line>
            <line x1="44" y1="154" x2="496" y2="154" stroke="#cfd7e3" stroke-width="1"></line>
            <text x="12" y="24" fill="#687487" font-size="12">100%</text>
            <text x="20" y="158" fill="#687487" font-size="12">0%</text>
            <text x="176" y="94" fill="#687487" font-size="13" id="chartEmpty">尚無資料</text>
            <polyline id="chartLine" fill="none" stroke="#146c70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></polyline>
            <g id="chartDots"></g>
          </svg>
        </section>

        <section class="panel phone-panel">
          <div class="chart-title">
            <h2>使用手機比率</h2>
            <span id="phoneCount">0 / 0 人</span>
          </div>
          <div class="phone-stat">
            <div class="phone-value" id="phoneRatio">0%</div>
            <div class="phone-detail" id="phoneDetail">尚未分析手機使用情況</div>
          </div>
        </section>

        <section class="panel phone-panel">
          <div class="chart-title">
            <h2>不專心比例</h2>
            <span id="inattentiveCount">0 / 0 人</span>
          </div>
          <div class="phone-stat">
            <div class="phone-value" id="ratio">0%</div>
            <div class="phone-detail" id="inattentiveDetail">尚未分析不專心情況</div>
          </div>
        </section>
      </aside>
    </section>
  </main>

  <canvas class="capture" id="captureCanvas"></canvas>

  <script>
    const state = {
      stream: null,
      timerId: null,
      isRunning: false,
      isAnalyzing: false,
      isPreviewHidden: false,
      isDashboardMode: false,
      apiProvider: "cgu",
      results: []
    };

    const API_PROVIDERS = {
      cgu: {
        label: "長庚 CGU LLM API",
        endpoint: "https://air.cgu.edu.tw/cgullmapi/v1",
        model: "gpt-6-luna"
      },
      openai: {
        label: "OpenAI API",
        endpoint: "https://api.openai.com/v1",
        model: "gpt-6-luna"
      },
      custom: {
        label: "自定義 API",
        endpoint: "",
        model: ""
      }
    };

    const els = {
      dashboardBtn: document.getElementById("dashboardBtn"),
      apiProvider: document.getElementById("apiProvider"),
      apiEndpoint: document.getElementById("apiEndpoint"),
      apiKey: document.getElementById("apiKey"),
      model: document.getElementById("model"),
      interval: document.getElementById("interval"),
      cameraSource: document.getElementById("cameraSource"),
      camera: document.getElementById("camera"),
      cameraPanel: document.getElementById("cameraPanel"),
      emptyCamera: document.getElementById("emptyCamera"),
      canvas: document.getElementById("captureCanvas"),
      cameraBtn: document.getElementById("cameraBtn"),
      refreshCamerasBtn: document.getElementById("refreshCamerasBtn"),
      previewToggleBtn: document.getElementById("previewToggleBtn"),
      startBtn: document.getElementById("startBtn"),
      pauseBtn: document.getElementById("pauseBtn"),
      captureBtn: document.getElementById("captureBtn"),
      clearBtn: document.getElementById("clearBtn"),
      liveDot: document.getElementById("liveDot"),
      liveText: document.getElementById("liveText"),
      status: document.getElementById("status"),
      totalPeople: document.getElementById("totalPeople"),
      inattentivePeople: document.getElementById("inattentivePeople"),
      inattentiveCount: document.getElementById("inattentiveCount"),
      inattentiveDetail: document.getElementById("inattentiveDetail"),
      ratio: document.getElementById("ratio"),
      summary: document.getElementById("summary"),
      phoneCount: document.getElementById("phoneCount"),
      phoneRatio: document.getElementById("phoneRatio"),
      phoneDetail: document.getElementById("phoneDetail"),
      resultsBody: document.getElementById("resultsBody"),
      sampleCount: document.getElementById("sampleCount"),
      chartLine: document.getElementById("chartLine"),
      chartDots: document.getElementById("chartDots"),
      chartEmpty: document.getElementById("chartEmpty")
    };

    const analysisSchema = {
      type: "object",
      additionalProperties: false,
      properties: {
        total_people: {
          type: "number",
          description: "畫面中可見的聽課人物總數。"
        },
        inattentive_people: {
          type: "number",
          description: "疑似不專心的人數。"
        },
        inattentive_ratio: {
          type: "number",
          description: "疑似不專心人數除以總人數，範圍 0 到 1。"
        },
        phone_users: {
          type: "number",
          description: "畫面中正在使用手機或明顯看手機的人數。"
        },
        phone_usage_ratio: {
          type: "number",
          description: "正在使用手機人數除以總人數，範圍 0 到 1。"
        },
        summary_zh: {
          type: "string",
          description: "繁體中文的一句摘要。"
        }
      },
      required: [
        "total_people",
        "inattentive_people",
        "inattentive_ratio",
        "phone_users",
        "phone_usage_ratio",
        "summary_zh"
      ]
    };

    const systemPrompt = [
      "你是課堂聽眾群體專注度分析助手。",
      "請只根據畫面中的可見行為估算群體狀態，不要辨識或推測任何人的身分、姓名、性別、年齡、種族、情緒診斷或敏感屬性。",
      "不專心的判斷依據包含：低頭看非課堂物品、明顯轉頭交談、睡覺或閉眼、離席、長時間沒有面向講者或螢幕、做與課堂無關的動作。",
      "請另外估算正在使用手機或明顯看手機的人數與比率。",
      "如果畫面模糊、遮擋、角度不佳或人數難以判斷，請保守估計。",
      "輸出必須符合指定 JSON schema。summary_zh 使用繁體中文。",
      "此結果只作為輔助觀察，不可用於紀律處分或個人評分。"
    ].join("\n");

    const userPrompt = [
      "請分析這張課堂照片中的聽課人物行為。",
      "請估算總人數、疑似不專心人數、不專心比例、使用手機人數、使用手機比率與摘要。",
      "請回傳結構化 JSON，不要包含照片或個人身份資訊。"
    ].join("\n");

    function setStatus(message, type = "") {
      els.status.textContent = message;
      els.status.className = `status ${type}`.trim();
    }

    function updateLiveState() {
      els.liveDot.classList.toggle("on", Boolean(state.stream));
      if (state.isAnalyzing) {
        els.liveText.textContent = "分析中";
      } else if (state.isRunning) {
        els.liveText.textContent = "自動分析";
      } else if (state.stream) {
        els.liveText.textContent = "鏡頭已開啟";
      } else {
        els.liveText.textContent = "待機";
      }
      els.cameraPanel.classList.toggle("has-stream", Boolean(state.stream));
      els.cameraPanel.classList.toggle("preview-hidden", state.isPreviewHidden);
      els.previewToggleBtn.textContent = state.isPreviewHidden ? "顯示影像" : "隱藏影像";
      els.pauseBtn.disabled = !state.isRunning;
      els.startBtn.disabled = state.isRunning;
    }

    function togglePreviewVisibility() {
      state.isPreviewHidden = !state.isPreviewHidden;
      updateLiveState();
      setStatus(state.isPreviewHidden ? "影像預覽已隱藏，分析仍會使用鏡頭畫面。" : "影像預覽已重新顯示。", "ok");
    }

    function applyDashboardTone() {
      document.body.classList.remove("dashboard-low", "dashboard-medium", "dashboard-high");

      if (!state.isDashboardMode || state.results.length === 0) {
        return;
      }

      const ratio = state.results[0].inattentive_ratio;
      if (ratio > 0.5) {
        document.body.classList.add("dashboard-high");
      } else if (ratio < 0.2) {
        document.body.classList.add("dashboard-low");
      } else {
        document.body.classList.add("dashboard-medium");
      }
    }

    function toggleDashboardMode() {
      state.isDashboardMode = !state.isDashboardMode;
      document.body.classList.toggle("dashboard-mode", state.isDashboardMode);
      els.dashboardBtn.textContent = state.isDashboardMode ? "返回完整模式" : "Dashboard 模式";
      els.dashboardBtn.setAttribute("aria-pressed", String(state.isDashboardMode));
      applyDashboardTone();
    }

    function getIntervalMs() {
      const seconds = Number.parseInt(els.interval.value, 10);
      return Math.max(Number.isFinite(seconds) ? seconds : 30, 10) * 1000;
    }

    function normalizeResponsesEndpoint(endpoint) {
      const value = endpoint.trim();
      if (!value) {
        throw new Error("請先輸入 API endpoint。");
      }

      let url;
      try {
        url = new URL(value, window.location.href);
      } catch {
        throw new Error("API endpoint 格式不正確，請輸入完整網址。");
      }

      if (!["http:", "https:"].includes(url.protocol)) {
        throw new Error("API endpoint 需使用 http 或 https。");
      }

      const path = url.pathname.replace(/\/+$/, "");
      url.pathname = path.endsWith("/responses") ? path : `${path}/responses`;
      return url.toString();
    }

    function getProviderConfig() {
      return API_PROVIDERS[els.apiProvider.value] || API_PROVIDERS.custom;
    }

    function getApiConfig() {
      const provider = getProviderConfig();
      const apiKey = els.apiKey.value.trim();
      if (!apiKey) {
        setStatus(`請先輸入 ${provider.label} 的 API key 或 Authorization。`, "error");
        return null;
      }

      const model = els.model.value.trim();
      if (!model) {
        setStatus("請先輸入要使用的模型名稱。", "error");
        return null;
      }

      let url = "";
      try {
        url = normalizeResponsesEndpoint(els.apiEndpoint.value);
      } catch (error) {
        setStatus(error.message, "error");
        return null;
      }

      return {
        providerName: provider.label,
        responsesUrl: url,
        model,
        authorization: /^Bearer\s+/i.test(apiKey) ? apiKey : `Bearer ${apiKey}`
      };
    }

    function isKnownDefaultEndpoint(value) {
      return Object.values(API_PROVIDERS).some((provider) => provider.endpoint && provider.endpoint === value.trim());
    }

    function isKnownDefaultModel(value) {
      return Object.values(API_PROVIDERS).some((provider) => provider.model && provider.model === value.trim());
    }

    function syncApiProviderDefaults() {
      const provider = getProviderConfig();
      els.apiEndpoint.placeholder = provider.endpoint || "https://your-server.example/v1 或完整 /responses endpoint";

      if (provider.endpoint) {
        els.apiEndpoint.value = provider.endpoint;
      } else if (els.apiProvider.value === "custom" && isKnownDefaultEndpoint(els.apiEndpoint.value)) {
        els.apiEndpoint.value = "";
      }

      if (provider.model) {
        els.model.value = provider.model;
      } else if (els.apiProvider.value === "custom" && isKnownDefaultModel(els.model.value)) {
        els.model.value = "";
      }

      state.apiProvider = els.apiProvider.value;
      setStatus(`已切換至 ${provider.label}。請確認 endpoint、API key 與模型。`, "warn");
    }

    function isSecureCameraContext() {
      return window.isSecureContext || ["localhost", "127.0.0.1", "::1"].includes(window.location.hostname);
    }

    function stopCamera() {
      if (state.stream) {
        state.stream.getTracks().forEach((track) => track.stop());
        state.stream = null;
      }
      els.camera.srcObject = null;
      updateLiveState();
    }

    function getCameraConstraints() {
      const selected = els.cameraSource.value || "default";
      const video = {
        width: { ideal: 1280 },
        height: { ideal: 720 }
      };

      if (selected.startsWith("device:")) {
        video.deviceId = { exact: selected.slice("device:".length) };
      } else if (selected === "user" || selected === "environment") {
        video.facingMode = { ideal: selected };
      }

      return { video, audio: false };
    }

    async function populateCameraDevices() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
        return;
      }

      const currentValue = els.cameraSource.value || "default";
      const devices = await navigator.mediaDevices.enumerateDevices();
      const videoDevices = devices.filter((device) => device.kind === "videoinput");
      const baseOptions = [
        new Option("自動選擇 / USB 或內建鏡頭", "default"),
        new Option("前鏡頭", "user"),
        new Option("後鏡頭 / iPhone 主鏡頭", "environment")
      ];

      const deviceOptions = videoDevices.map((device, index) => {
        const label = device.label || `鏡頭 ${index + 1}`;
        return new Option(label, `device:${device.deviceId}`);
      });

      els.cameraSource.replaceChildren(...baseOptions, ...deviceOptions);

      const hasCurrent = [...els.cameraSource.options].some((option) => option.value === currentValue);
      els.cameraSource.value = hasCurrent ? currentValue : "default";
    }

    async function refreshCameraDevices() {
      try {
        await populateCameraDevices();
        const deviceCount = [...els.cameraSource.options].filter((option) => option.value.startsWith("device:")).length;
        setStatus(deviceCount > 0
          ? `已找到 ${deviceCount} 個可用鏡頭，請從鏡頭來源選單選擇 USB camera。`
          : "尚未取得鏡頭名稱。請先按「開啟鏡頭」並允許權限，再重新掃描。", "ok");
      } catch (error) {
        setStatus(error.message || "無法掃描鏡頭。", "error");
      }
    }

    async function ensureCamera(forceRestart = false) {
      if (state.stream && !forceRestart) {
        return;
      }

      if (forceRestart) {
        stopCamera();
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error("此瀏覽器不支援鏡頭 API，Windows 請使用新版 Chrome 或 Edge。");
      }

      if (!isSecureCameraContext()) {
        throw new Error("瀏覽器需要安全來源才能啟用鏡頭。請用 HTTPS，或在同一台電腦以 localhost / 127.0.0.1 開啟；直接用 file:// 開啟可能無法列出 USB camera。");
      }

      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia(getCameraConstraints());
      } catch (error) {
        if (els.cameraSource.value !== "default") {
          throw error;
        }
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });
      }

      state.stream = stream;
      els.camera.srcObject = stream;
      await els.camera.play();
      await populateCameraDevices();
      updateLiveState();
    }

    function captureFrame() {
      if (!state.stream || !els.camera.videoWidth || !els.camera.videoHeight) {
        throw new Error("鏡頭尚未準備好，請稍後再試。");
      }

      const maxWidth = 1024;
      const scale = Math.min(1, maxWidth / els.camera.videoWidth);
      const width = Math.round(els.camera.videoWidth * scale);
      const height = Math.round(els.camera.videoHeight * scale);

      els.canvas.width = width;
      els.canvas.height = height;
      const ctx = els.canvas.getContext("2d", { alpha: false });
      ctx.drawImage(els.camera, 0, 0, width, height);

      return els.canvas.toDataURL("image/jpeg", 0.75);
    }

    function buildPayload(imageDataUrl, model) {
      return {
        model,
        store: false,
        instructions: systemPrompt,
        input: [
          {
            role: "user",
            content: [
              { type: "input_text", text: userPrompt },
              { type: "input_image", image_url: imageDataUrl }
            ]
          }
        ],
        text: {
          format: {
            type: "json_schema",
            name: "class_attention_analysis",
            strict: true,
            schema: analysisSchema
          }
        }
      };
    }

    function extractOutputText(responseJson) {
      if (typeof responseJson.output_text === "string") {
        return responseJson.output_text;
      }

      const chunks = [];
      for (const item of responseJson.output || []) {
        for (const content of item.content || []) {
          if (typeof content.text === "string") {
            chunks.push(content.text);
          }
        }
      }
      return chunks.join("\n").trim();
    }

    function normalizeAnalysis(raw) {
      const total = Math.max(0, Math.round(Number(raw.total_people) || 0));
      const inattentive = Math.min(total, Math.max(0, Math.round(Number(raw.inattentive_people) || 0)));
      const fallbackRatio = total > 0 ? inattentive / total : 0;
      const ratio = Number.isFinite(Number(raw.inattentive_ratio))
        ? Math.min(1, Math.max(0, Number(raw.inattentive_ratio)))
        : fallbackRatio;
      const phoneUsers = Math.min(total, Math.max(0, Math.round(Number(raw.phone_users) || 0)));
      const fallbackPhoneRatio = total > 0 ? phoneUsers / total : 0;
      const phoneRatio = Number.isFinite(Number(raw.phone_usage_ratio))
        ? Math.min(1, Math.max(0, Number(raw.phone_usage_ratio)))
        : fallbackPhoneRatio;

      return {
        total_people: total,
        inattentive_people: inattentive,
        inattentive_ratio: ratio,
        phone_users: phoneUsers,
        phone_usage_ratio: phoneRatio,
        summary_zh: String(raw.summary_zh || "未提供摘要。")
      };
    }

    async function callResponsesApi(imageDataUrl, apiConfig) {
      let response;
      try {
        response = await fetch(apiConfig.responsesUrl, {
          method: "POST",
          headers: {
            "Authorization": apiConfig.authorization,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(buildPayload(imageDataUrl, apiConfig.model))
        });
      } catch (error) {
        throw new Error(`無法連線到 ${apiConfig.providerName}：${error.message || "可能是網路、CORS 或瀏覽器安全限制"}`);
      }

      const responseText = await response.text();
      let responseJson;
      try {
        responseJson = JSON.parse(responseText);
      } catch {
        throw new Error(`API 回應不是 JSON：${responseText.slice(0, 180)}`);
      }

      if (!response.ok) {
        const message = responseJson.error && responseJson.error.message
          ? responseJson.error.message
          : `API 請求失敗，HTTP ${response.status}`;
        throw new Error(message);
      }

      const outputText = extractOutputText(responseJson);
      if (!outputText) {
        throw new Error("API 回應沒有可解析的分析文字。");
      }

      try {
        return normalizeAnalysis(JSON.parse(outputText));
      } catch {
        throw new Error(`分析結果不是有效 JSON：${outputText.slice(0, 180)}`);
      }
    }

    async function analyzeOnce(source = "manual") {
      const apiConfig = getApiConfig();
      if (!apiConfig || state.isAnalyzing) {
        if (state.isAnalyzing) {
          setStatus("上一張照片仍在分析中，已略過這次拍攝。", "warn");
        }
        return;
      }

      state.isAnalyzing = true;
      updateLiveState();

      let imageDataUrl = "";
      try {
        await ensureCamera();
        setStatus(source === "auto" ? "正在進行定時分析..." : "正在分析目前畫面...", "warn");
        imageDataUrl = captureFrame();
        const analysis = await callResponsesApi(imageDataUrl, apiConfig);
        imageDataUrl = "";
        addResult(analysis);
        setStatus("分析完成。照片未被保存在頁面中。", "ok");
      } catch (error) {
        setStatus(error.message || "分析失敗。", "error");
      } finally {
        imageDataUrl = "";
        state.isAnalyzing = false;
        updateLiveState();
      }
    }

    async function startAutoAnalysis() {
      if (!getApiConfig()) {
        return;
      }

      try {
        await ensureCamera();
      } catch (error) {
        setStatus(error.message || "無法啟動鏡頭。", "error");
        updateLiveState();
        return;
      }

      state.isRunning = true;
      updateLiveState();
      setStatus("自動分析已啟動。", "ok");
      await analyzeOnce("auto");

      clearInterval(state.timerId);
      state.timerId = setInterval(() => {
        analyzeOnce("auto");
      }, getIntervalMs());
    }

    async function openCameraOnly() {
      try {
        await ensureCamera(true);
        setStatus("鏡頭已啟動。Windows Chrome/Edge 可從鏡頭來源選單切換 USB camera。", "ok");
      } catch (error) {
        setStatus(error.message || "無法啟動鏡頭。", "error");
        updateLiveState();
      }
    }

    function pauseAutoAnalysis() {
      state.isRunning = false;
      clearInterval(state.timerId);
      state.timerId = null;
      updateLiveState();
      setStatus("自動分析已暫停，鏡頭仍保持開啟。", "warn");
    }

    function addResult(analysis) {
      const result = {
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
        at: new Date(),
        ...analysis
      };
      state.results.unshift(result);
      updateMetrics(result);
      renderResults();
      renderChart();
      applyDashboardTone();
    }

    function formatPercent(value) {
      return `${Math.round(value * 100)}%`;
    }

    function formatTime(date) {
      return new Intl.DateTimeFormat("zh-TW", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      }).format(date);
    }

    function updateMetrics(result) {
      els.totalPeople.textContent = result.total_people;
      els.inattentivePeople.textContent = result.inattentive_people;
      els.inattentiveCount.textContent = `${result.inattentive_people} / ${result.total_people} 人`;
      els.ratio.textContent = formatPercent(result.inattentive_ratio);
      els.inattentiveDetail.textContent = result.total_people > 0
        ? `畫面中約 ${result.inattentive_people} 人疑似不專心。`
        : "畫面中未偵測到可估算的聽課人物。";
      els.summary.textContent = result.summary_zh;
      els.phoneCount.textContent = `${result.phone_users} / ${result.total_people} 人`;
      els.phoneRatio.textContent = formatPercent(result.phone_usage_ratio);
      els.phoneDetail.textContent = result.total_people > 0
        ? `畫面中約 ${result.phone_users} 人正在使用或明顯看手機。`
        : "畫面中未偵測到可估算的聽課人物。";
    }

    function renderResults() {
      els.sampleCount.textContent = `${state.results.length} 筆`;

      if (state.results.length === 0) {
        els.resultsBody.innerHTML = '<tr><td class="empty-row" colspan="5">尚無分析結果</td></tr>';
        return;
      }

      els.resultsBody.replaceChildren(...state.results.map((result) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${formatTime(result.at)}</td>
          <td>${result.total_people}</td>
          <td>${result.inattentive_people}</td>
          <td>${formatPercent(result.inattentive_ratio)}</td>
          <td>${escapeHtml(result.summary_zh)}</td>
        `;
        return row;
      }));
    }

    function renderChart() {
      const ordered = [...state.results].reverse();
      els.chartEmpty.classList.toggle("hidden", ordered.length > 0);

      if (ordered.length === 0) {
        els.chartLine.setAttribute("points", "");
        els.chartDots.replaceChildren();
        return;
      }

      const left = 44;
      const right = 496;
      const top = 18;
      const bottom = 154;
      const width = right - left;
      const height = bottom - top;
      const denom = Math.max(ordered.length - 1, 1);

      const points = ordered.map((result, index) => {
        const x = ordered.length === 1 ? left + width / 2 : left + (index / denom) * width;
        const y = bottom - result.inattentive_ratio * height;
        return { x, y, result };
      });

      els.chartLine.setAttribute("points", points.map((point) => `${point.x.toFixed(1)},${point.y.toFixed(1)}`).join(" "));
      els.chartDots.replaceChildren(...points.map((point) => {
        const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        dot.setAttribute("cx", point.x.toFixed(1));
        dot.setAttribute("cy", point.y.toFixed(1));
        dot.setAttribute("r", "4");
        dot.setAttribute("fill", "#b7791f");
        dot.setAttribute("stroke", "#ffffff");
        dot.setAttribute("stroke-width", "2");
        return dot;
      }));
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function clearResults() {
      state.results = [];
      els.totalPeople.textContent = "0";
      els.inattentivePeople.textContent = "0";
      els.inattentiveCount.textContent = "0 / 0 人";
      els.ratio.textContent = "0%";
      els.inattentiveDetail.textContent = "尚未分析不專心情況";
      els.summary.textContent = "尚未分析";
      els.phoneCount.textContent = "0 / 0 人";
      els.phoneRatio.textContent = "0%";
      els.phoneDetail.textContent = "尚未分析手機使用情況";
      renderResults();
      renderChart();
      applyDashboardTone();
      setStatus("紀錄已清除。", "ok");
    }

    els.dashboardBtn.addEventListener("click", toggleDashboardMode);
    els.apiProvider.addEventListener("change", syncApiProviderDefaults);
    els.cameraBtn.addEventListener("click", openCameraOnly);
    els.refreshCamerasBtn.addEventListener("click", refreshCameraDevices);
    els.previewToggleBtn.addEventListener("click", togglePreviewVisibility);
    els.startBtn.addEventListener("click", startAutoAnalysis);
    els.pauseBtn.addEventListener("click", pauseAutoAnalysis);
    els.captureBtn.addEventListener("click", () => analyzeOnce("manual"));
    els.clearBtn.addEventListener("click", clearResults);

    els.cameraSource.addEventListener("change", async () => {
      if (!state.stream) {
        return;
      }

      try {
        await ensureCamera(true);
        setStatus("鏡頭來源已切換。", "ok");
      } catch (error) {
        setStatus(error.message || "無法切換鏡頭來源。", "error");
      }
    });

    els.interval.addEventListener("change", () => {
      if (!state.isRunning) {
        return;
      }
      clearInterval(state.timerId);
      state.timerId = setInterval(() => analyzeOnce("auto"), getIntervalMs());
      setStatus("間隔已更新。", "ok");
    });

    if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
      navigator.mediaDevices.addEventListener("devicechange", populateCameraDevices);
    }

    populateCameraDevices();

    window.addEventListener("beforeunload", () => {
      clearInterval(state.timerId);
      stopCamera();
    });

    renderChart();
    updateLiveState();
  </script>
</body>
</html>
